spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: none

idp:
  setup:
    token: ${OIH_SETUP_TOKEN}
  crypto:
    token: pkcs11
    library: ${OIH_HSM_LIBRARY:/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so}
    pin: ${OIH_HSM_PIN}
  mfa:
    envelope-key: ${OIH_TOTP_WRAP_KEY}
