spring:
  application:
    name: imt-idp
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  datasource:
    hikari:
      maximum-pool-size: 10

server:
  servlet:
    session:
      cookie:
        name: IMTIDPSESS
        http-only: true
        same-site: lax
      timeout: 30m
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,hsm

idp:
  display-name: InfraMindTech
  password:
    min-length: 12
    max-length: 128
    required-character-classes: 3
    history-size: 5
    argon2-salt-length: 16
    argon2-hash-length: 32
    argon2-parallelism: 1
    argon2-memory-kib: 16384
    argon2-iterations: 2
  lockout:
    failure-threshold: 5
    lock-duration: 15m
    second-threshold: 8
    second-lock-duration: 1h
    third-threshold: 12
    third-lock-duration: 24h
    ip-window: 15m
    ip-failure-threshold: 30
  setup:
    token: ${OIH_SETUP_TOKEN:}
  mfa:
    enabled: false
    envelope-key: ${OIH_TOTP_WRAP_KEY:}
  entity-id: ${OIH_ENTITY_ID:https://idp.example.org/saml2/idp/metadata}
  base-url: ${OIH_BASE_URL:http://127.0.0.1:8080}
  crypto:
    token: software
    library: ${OIH_HSM_LIBRARY:/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so}
    pin: ${OIH_HSM_PIN:}
    key-size: 3072
  saml:
    assertion-ttl: 5m
    clock-skew: 2m
    request-max-age: 10m
    max-body-bytes: 262144
    want-authn-requests-signed: true
    partial-logout-mode: SUCCESS
