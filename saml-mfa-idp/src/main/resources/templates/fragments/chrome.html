<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="color-scheme" content="light"/>
    <meta name="theme-color" content="#0B1F3A"/>
    <title th:text="${title}">OIH Identity</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml"/>
    <link rel="stylesheet" th:href="@{/css/idp.css}"/>
</th:block>

<span th:fragment="mark" class="mark" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="28" height="28" focusable="false">
        <rect width="32" height="32" rx="8" fill="currentColor"/>
        <path d="M16 6.5c4.2 2.1 6.8 2.6 8 2.8v7.3c0 4.7-3.1 7.9-8 9.9-4.9-2-8-5.2-8-9.9V9.3c1.2-.2 3.8-.7 8-2.8z" fill="#E8EEF7"/>
        <path d="M14.2 16.7l1.5 1.5 3.7-3.8 1.3 1.3-5 5.1-2.8-2.8 1.3-1.3z" fill="#0B1F3A"/>
    </svg>
</span>

<header th:fragment="appbar(active, showAdmin)" class="appbar">
    <a class="brand-lockup" th:href="@{/account}">
        <span th:replace="~{fragments/chrome :: mark}"></span>
        <span class="brand-text">
            <strong th:text="${displayName}">OIH Local Identity Provider</strong>
            <span class="brand-sub">Identity platform</span>
        </span>
    </a>
    <nav class="appbar-nav" aria-label="Primary">
        <a th:href="@{/account}" th:classappend="${active == 'account'} ? ' is-active'" th:attr="aria-current=${active == 'account'} ? 'page' : null">Account</a>
        <th:block th:if="${showAdmin}">
            <a th:href="@{/admin}" th:classappend="${active == 'users'} ? ' is-active'">Users</a>
            <a th:href="@{/admin/sp}" th:classappend="${active == 'sp'} ? ' is-active'">Service providers</a>
            <a th:href="@{/admin/keys}" th:classappend="${active == 'keys'} ? ' is-active'">Signing keys</a>
        </th:block>
    </nav>
    <div class="appbar-actions">
        <a th:if="${showAdmin and active == 'account'}" class="btn btn-ghost" th:href="@{/admin}">Admin</a>
        <form class="inline" th:if="${active == 'account'}" th:action="@{/account/logout-global}" method="post">
            <button class="btn btn-ghost" type="submit">Sign out everywhere</button>
        </form>
        <form class="inline" th:action="@{/logout}" method="post">
            <button class="btn btn-secondary" type="submit">Sign out</button>
        </form>
    </div>
</header>
</body>
</html>
