<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/chrome :: head('Service providers')}"/>
</head>
<body>
<header th:replace="~{fragments/chrome :: appbar('sp', true)}"></header>
<main class="wrap">
    <div class="page-head">
        <div>
            <p class="eyebrow">SAML</p>
            <h1>Service providers</h1>
            <p>ACS URLs are allow-listed exactly. Unregistered issuers never receive an assertion.</p>
        </div>
        <a class="btn btn-secondary" th:href="@{/saml2/idp/metadata}">IdP metadata</a>
    </div>
    <p class="flash ok" th:if="${info}" th:text="${info}"></p>
    <section class="card">
        <h2>Register SP</h2>
        <form th:action="@{/admin/sp}" method="post">
            <div class="grid-2">
                <label>Entity ID
                    <input type="url" name="entityId" required placeholder="https://app.example.com/saml/metadata"/>
                </label>
                <label>Display name
                    <input type="text" name="displayName" required placeholder="Finance portal"/>
                </label>
                <label>ACS (HTTP-POST)
                    <input type="url" name="acs" required placeholder="https://app.example.com/saml/acs"/>
                </label>
                <label>SLO (HTTP-POST)
                    <input type="url" name="slo" placeholder="https://app.example.com/saml/slo"/>
                </label>
            </div>
            <label class="field-row"><input type="checkbox" name="wantSigned" value="true"/> Require signed AuthnRequest</label>
            <label class="field-row"><input type="checkbox" name="encrypt" value="true"/> Encrypt assertions (needs SP encryption cert)</label>
            <button class="btn" type="submit">Register</button>
        </form>
    </section>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Entity ID</th>
                <th>Name</th>
                <th>Enabled</th>
                <th>Signed AuthnRequest</th>
                <th>Encrypt</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sp : ${sps}">
                <td class="mono" th:text="${sp.entityId}">https://sp</td>
                <td th:text="${sp.displayName}">SP</td>
                <td>
                    <span class="badge badge-ok" th:if="${sp.enabled}">Enabled</span>
                    <span class="badge badge-err" th:unless="${sp.enabled}">Disabled</span>
                    <span th:text="${sp.enabled}" hidden="hidden">true</span>
                </td>
                <td th:text="${sp.wantAuthnRequestsSigned}">false</td>
                <td th:text="${sp.encryptAssertions}">false</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
