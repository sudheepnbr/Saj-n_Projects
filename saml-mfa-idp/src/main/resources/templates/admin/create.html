<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/chrome :: head('Create user')}"/>
</head>
<body>
<header th:replace="~{fragments/chrome :: appbar('users', true)}"></header>
<main class="wrap">
    <div class="page-head">
        <div>
            <p class="eyebrow">Administration</p>
            <h1>Create user</h1>
            <p>Every account also receives the USER role. Choose an extra role if this person administers the IdP.</p>
        </div>
        <a class="btn btn-secondary" th:href="@{/admin}">Back to users</a>
    </div>
    <p class="flash err" th:if="${error}" th:text="${error}"></p>
    <form class="card card-narrow" th:action="@{/admin/users}" method="post">
        <div class="grid-2">
            <label>Username
                <input type="text" name="username" required autocomplete="off"/>
            </label>
            <label>Email
                <input type="email" name="email" required/>
            </label>
            <label>First name
                <input type="text" name="firstName" required/>
            </label>
            <label>Last name
                <input type="text" name="lastName" required/>
            </label>
        </div>
        <label>Password
            <input type="password" name="password" required minlength="12" autocomplete="new-password"/>
            <span class="hint">Minimum 12 characters, three character classes.</span>
        </label>
        <label>Role
            <select name="role">
                <option value="USER" selected>USER</option>
                <option value="OPERATOR">OPERATOR</option>
                <option value="ADMIN">ADMIN</option>
                <option value="AUDITOR">AUDITOR</option>
            </select>
        </label>
        <button class="btn" type="submit">Create</button>
    </form>
</main>
</body>
</html>
